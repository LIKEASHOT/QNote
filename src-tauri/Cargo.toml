[package]
name = "qnote"
version = "0.1.0"
description = "QNote - A Zen, Lightweight Parchment Note-Taking App for macOS"
authors = ["QNote Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
